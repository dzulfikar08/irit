[package]
name = "dblock"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
fs4 = "1.1.0"
humantime = "2.4.0"
# Static: never link the build machine's liblzma (see leanqc/Cargo.toml).
liblzma = { version = "0.4.9", features = ["static"] }
md-5 = "0.11.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11"
zstd = { version = "0.14.3", default-features = false }
tar = "0.4.46"
tempfile = "3.27"
toml = "1.2.1"
ureq = "3.5.1"
