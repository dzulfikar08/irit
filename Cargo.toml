[workspace]
resolver = "3"
members = ["sheetgen", "leanqc", "dblock", "isotable", "mcp", "gtdbprep", "seqplan", "msascope"]
# msascope's GUI needs GPUI and its system libraries; build it explicitly with `-p msascope`.
default-members = ["sheetgen", "leanqc", "dblock", "isotable", "mcp", "gtdbprep", "seqplan"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.4.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
