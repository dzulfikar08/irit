[package]
name = "leanqc"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
# Unused directly: switches needletail's gzip decoding from miniz_oxide to the faster zlib-rs.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Unused directly: builds needletail's xz support from source instead of linking whatever liblzma the
# build machine has (Homebrew's on macOS runners, which signed binaries can't load).
liblzma = { version = "0.4.9", features = ["static"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
memchr = "2.8.3"
needletail = "0.7.4"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27"
