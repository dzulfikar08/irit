[package]
name = "sheetgen"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
jsonschema = { version = "0.61.0", default-features = false }
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27"
