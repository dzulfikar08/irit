[package]
name = "sheetgen"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# zlib-rs decodes gzip faster than the default backend (`sheetgen verify` reads whole files).
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
jsonschema = { version = "0.61.0", default-features = false }
md-5 = "0.11.0"
memchr = "2.8.3"
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
ureq = "3.5.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27"
