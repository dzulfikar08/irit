# Versioned releases. Push a tag `vX.Y.Z` that matches [workspace.package] version in Cargo.toml
# and has a dated `## X.Y.Z (YYYY-MM-DD)` section in CHANGELOG.md (not "(unreleased)"):
#   git tag -a v0.2.0 -m "irit 0.2.0" && git push origin v0.2.0
# The GitHub Release (notes = that CHANGELOG section) gets, each under a versioned name
# (irit-X.Y.Z-..., msascope-X.Y.Z...) and an unversioned copy:
#   irit-x86_64-linux.tar.gz, irit-aarch64-linux.tar.gz   command-line tools, static (musl)
#   irit-universal-macos.tar.gz                           command-line tools, universal,
#                                                         Developer ID signed and notarised
#   irit-x86_64-windows.zip                               sheetgen, leanqc, isotable, dblock (unsigned)
#   msascope.dmg                                           msascope.app, universal, notarised, stapled
#   msascope-universal-macos.tar.gz                        the same msascope.app (for install.sh)
#   msascope-x86_64-linux.tar.gz, msascope-aarch64-linux.tar.gz   glibc 2.39+ (Ubuntu 24.04 builds)
#   SHA256SUMS                                            every archive above
# The command-line archives hold sheetgen, leanqc, isotable, dblock, irit-mcp, gtdbprep and
# irit-gtdb-prep (Windows: the first four; irit-mcp and gtdbprep are Unix-only).
# The unversioned names are what https://github.com/dzulfikar08/irit/releases/latest/download/<name>
# and scripts/install.sh use, so they must not change.
#
# Dry run (builds, signs and notarises everything, uploads workflow artifacts only, no release):
#   gh workflow run release.yml --ref main            # dry_run defaults to true
# The macOS job uses the `release` environment (Developer ID + App Store Connect secrets), which
# only main and v* tags may use. dry_run=false is only accepted on a v* tag ref, to redo a
# release whose tag push failed:  gh workflow run release.yml --ref v0.2.0 -f dry_run=false
# (Ad-hoc, unsigned msascope builds: msascope.yml.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and notarise, but upload workflow artifacts only (no GitHub Release)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Packages and binaries in the command-line archives (Windows: WIN_PKGS, binaries of the same name).
  CLI_PKGS: sheetgen leanqc isotable dblock irit-mcp gtdbprep
  CLI_BINS: sheetgen leanqc isotable dblock irit-mcp gtdbprep irit-gtdb-prep
  WIN_PKGS: sheetgen leanqc isotable dblock

jobs:
  check:
    name: check tag, version, changelog
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version (and tag) match Cargo.toml
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '/^\[workspace.package\]/{s=1;next} /^\[/{s=0} s && /^version *=/{gsub(/.*= *"|".*/,""); print; exit}' Cargo.toml)"
          [ -n "$cargo_version" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          publish=true
          if [ "$DRY_RUN" = true ]; then
            publish=false
          elif [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::publishing needs a v* tag ref (got ${GITHUB_REF}); use dry_run=true from a branch"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=${GITHUB_REF_NAME} Cargo.toml=${cargo_version}"
            if [ "$GITHUB_REF_NAME" != "v${cargo_version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${cargo_version} in Cargo.toml (expected v${cargo_version})"
              exit 1
            fi
          fi
          echo "version=${cargo_version} publish=${publish}"
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG has a (dated, when publishing) section for this version
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PUBLISH: ${{ steps.v.outputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            ./scripts/changelog-section.sh --released "$VERSION" > /dev/null
          else
            ./scripts/changelog-section.sh "$VERSION" > /dev/null
            ./scripts/changelog-section.sh --released "$VERSION" > /dev/null \
              || echo "::warning::CHANGELOG section ${VERSION} is still '(unreleased)': date it before tagging"
          fi

  linux-cli:
    name: linux CLIs (${{ matrix.arch }}, musl)
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, target: aarch64-unknown-linux-musl }
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
      NAME: irit-${{ needs.check.outputs.version }}-${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
      # Static (musl) builds run on old distributions too. --locked: build from the committed lockfile.
      - name: Build
        run: |
          set -euo pipefail
          pkgs=(); for p in $CLI_PKGS; do pkgs+=(-p "$p"); done
          cross build --release --locked --target ${{ matrix.target }} "${pkgs[@]}"
      - name: Smoke test
        run: |
          set -euo pipefail
          dir=target/${{ matrix.target }}/release
          for b in $CLI_BINS; do
            info="$(file -b "$dir/$b")"; echo "$b: $info"
            case "$info" in *static*) ;; *) echo "::error::$b is not statically linked"; exit 1 ;; esac
          done
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            for b in $CLI_BINS; do
              out="$("$dir/$b" --version)"; echo "$out"
              case "$out" in *"${VERSION}"*) ;; *) echo "::error::$b --version does not report ${VERSION}"; exit 1 ;; esac
            done
          fi
      - name: Package
        run: |
          set -euo pipefail
          bins=(); for b in $CLI_BINS; do bins+=("target/${{ matrix.target }}/release/$b"); done
          ./scripts/package.sh "dist/${NAME}" "${bins[@]}"
          tar -tzf "dist/${NAME}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-cli-${{ matrix.arch }}
          path: dist/${{ env.NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  linux-gui:
    name: linux msascope (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    # Ubuntu 24.04 sets the glibc baseline (2.39); GPUI links the system's libxkbcommon etc.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
      NAME: msascope-${{ needs.check.outputs.version }}-${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (as in msascope.yml)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-msascope
          cache-on-failure: true
      - run: cargo build --release --locked -p msascope --bin msascope
      - name: Smoke test
        run: |
          set -euo pipefail
          file target/release/msascope
          target/release/msascope --help
      - name: Acknowledgements (licences of msascope's dependencies)
        run: |
          cargo install cargo-about --locked --features cli
          ./scripts/acknowledgements.sh dist/Acknowledgements.html
      - name: Package
        run: |
          ./scripts/package.sh "dist/${NAME}" target/release/msascope dist/Acknowledgements.html
          tar -tzf "dist/${NAME}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-gui-${{ matrix.arch }}
          path: dist/${{ env.NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    name: windows CLIs (x86_64, unsigned)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
      NAME: irit-${{ needs.check.outputs.version }}-x86_64-windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
          cache-on-failure: true
      - name: Build
        run: |
          set -euo pipefail
          pkgs=(); for p in $WIN_PKGS; do pkgs+=(-p "$p"); done
          cargo build --release --locked "${pkgs[@]}"
      - name: Smoke test
        run: |
          set -euo pipefail
          for b in $WIN_PKGS; do
            out="$("target/release/$b.exe" --version)"; echo "$out"
            case "$out" in *"${VERSION}"*) ;; *) echo "::error::$b --version does not report ${VERSION}"; exit 1 ;; esac
          done
      - name: Package
        run: |
          set -euo pipefail
          bins=(); for b in $WIN_PKGS; do bins+=("target/release/$b.exe"); done
          ./scripts/package.sh --zip "dist/${NAME}" "${bins[@]}"
          7z l "dist/${NAME}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/${{ env.NAME }}.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macos (universal, signed, notarised)
    needs: check
    runs-on: macos-15
    timeout-minutes: 150
    # Developer ID + App Store Connect secrets; only main and v* tags may deploy to it.
    environment: release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: brew install librsvg   # rsvg-convert, for msascope.app's icon
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-universal
          cache-on-failure: true
      # First, so a missing secret fails the job before the long build.
      - name: Signing keychain and notary key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: ./scripts/ci-keychain.sh setup
      - name: Notary issuer is set
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: '[ -n "$ASC_ISSUER_ID" ] || { echo "::error::ASC_ISSUER_ID is not set (secrets of the ''release'' environment)"; exit 1; }'
      - name: Universal binaries (arm64 + x86_64)
        run: |
          # Word splitting of the package and binary lists is intended.
          # shellcheck disable=SC2086
          ./scripts/macos-universal.sh dist/universal $CLI_PKGS msascope -- $CLI_BINS msascope
      - name: Sign and notarise the command-line tools
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          bins=(); for b in $CLI_BINS; do bins+=("dist/universal/$b"); done
          ./scripts/sign-macos.sh --notarize "${bins[@]}"
      - name: Acknowledgements (licences of msascope's dependencies)
        run: |
          cargo install cargo-about --locked --features cli
          ./scripts/acknowledgements.sh dist/Acknowledgements.html
      - name: Build, sign, notarise, staple (msascope.app + DMG)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MSASCOPE_ACKNOWLEDGEMENTS: dist/Acknowledgements.html
        run: ./scripts/build-dmg.sh --notarize --name "msascope-${VERSION}" dist/universal/msascope dist
      - name: Smoke test
        run: |
          set -euo pipefail
          for b in $CLI_BINS; do
            bin="dist/universal/$b"
            echo "$b: $(lipo -archs "$bin")"
            codesign --verify --strict "$bin"
            codesign --display --verbose=2 "$bin" 2>&1 | grep -q '^Authority=Developer ID Application' \
              || { echo "::error::$b is not Developer ID signed"; exit 1; }
            out="$("$bin" --version)"; echo "$out"
            case "$out" in *"${VERSION}"*) ;; *) echo "::error::$b --version does not report ${VERSION}"; exit 1 ;; esac
          done
          # The x86_64 slices, through Rosetta when the runner has it.
          arch -x86_64 dist/universal/leanqc --version || echo "::warning::could not run the x86_64 slice (no Rosetta?)"
          app_bin=dist/msascope.app/Contents/MacOS/msascope
          lipo -archs "$app_bin"
          "$app_bin" --help > /dev/null
          # The DMG mounts and holds the signed, stapled app and the Applications link.
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "dist/msascope-${VERSION}.dmg"
          ls -l "$mnt"
          test -d "$mnt/msascope.app" && test -L "$mnt/Applications"
          codesign --verify --strict "$mnt/msascope.app"
          spctl --assess --type execute --verbose=2 "$mnt/msascope.app"
          hdiutil detach "$mnt"
      - name: Tarballs (command-line tools; msascope.app for install.sh)
        run: |
          set -euo pipefail
          bins=(); for b in $CLI_BINS; do bins+=("dist/universal/$b"); done
          ./scripts/package.sh "dist/irit-${VERSION}-universal-macos" "${bins[@]}"
          ./scripts/package.sh "dist/msascope-${VERSION}-universal-macos" dist/msascope.app
          tar -tzf "dist/irit-${VERSION}-universal-macos.tar.gz"
          tar -tzf "dist/msascope-${VERSION}-universal-macos.tar.gz" | head -20
      - name: Remove keychain and notary key
        if: always()
        run: ./scripts/ci-keychain.sh cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/msascope-${{ env.VERSION }}.dmg
            dist/irit-${{ env.VERSION }}-universal-macos.tar.gz
            dist/msascope-${{ env.VERSION }}-universal-macos.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [check, linux-cli, linux-gui, windows, macos]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Unversioned names and checksums
        run: |
          set -euo pipefail
          cd dist
          for f in irit-"${VERSION}"-* msascope-"${VERSION}"*; do
            cp "$f" "$(printf '%s' "$f" | sed "s/-${VERSION}//")"
          done
          ls -l
          sha256sum irit-*.tar.gz irit-*.zip msascope*.dmg msascope-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          for f in irit-x86_64-linux.tar.gz irit-aarch64-linux.tar.gz irit-universal-macos.tar.gz \
                   irit-x86_64-windows.zip msascope.dmg msascope-universal-macos.tar.gz \
                   msascope-x86_64-linux.tar.gz msascope-aarch64-linux.tar.gz; do
            grep -q "  ${f}\$" SHA256SUMS || { echo "::error::missing $f"; exit 1; }
          done
          test "$(wc -l < SHA256SUMS)" -eq 16
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          dl="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          ./scripts/changelog-section.sh --released "$VERSION" > notes.md
          cat >> notes.md <<EOF

          ## Download

          Terminal (Linux or macOS), installs into ~/.local/bin without sudo:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | IRIT_VERSION=${tag} sh
          \`\`\`

          - Linux command-line tools (static, any distribution): [x86_64](${dl}/irit-${VERSION}-x86_64-linux.tar.gz), [aarch64](${dl}/irit-${VERSION}-aarch64-linux.tar.gz)
          - macOS command-line tools (Apple Silicon and Intel, Developer ID signed and notarised): [irit-${VERSION}-universal-macos.tar.gz](${dl}/irit-${VERSION}-universal-macos.tar.gz)
          - msascope for macOS (signed, notarised): [msascope-${VERSION}.dmg](${dl}/msascope-${VERSION}.dmg). Open it and drag msascope to Applications.
          - msascope for Linux (glibc 2.39 or newer: Ubuntu 24.04, Debian 13, Fedora 40 or later): [x86_64](${dl}/msascope-${VERSION}-x86_64-linux.tar.gz), [aarch64](${dl}/msascope-${VERSION}-aarch64-linux.tar.gz)
          - Windows (sheetgen, leanqc, isotable, dblock): [irit-${VERSION}-x86_64-windows.zip](${dl}/irit-${VERSION}-x86_64-windows.zip). **Not code-signed**: SmartScreen may warn the first time you run them.

          Check downloads with \`sha256sum -c SHA256SUMS --ignore-missing\` (macOS: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`). More, including checking the macOS signatures: https://dzulfikar08.github.io/irit/install/
          EOF
          gh release create "$tag" dist/irit-*.tar.gz dist/irit-*.zip dist/msascope*.dmg dist/msascope-*.tar.gz dist/SHA256SUMS \
            --verify-tag --latest --title "irit ${VERSION}" --notes-file notes.md
