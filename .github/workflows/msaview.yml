name: msaview builds

# Builds the desktop viewer (and the msagen test-data generator) on GitHub's runners and uploads
# them as downloadable artifacts, so nobody has to compile GPUI locally. Not signed or notarised:
# these are ad-hoc test builds. Signed, notarised msaview builds come from release.yml (v* tags).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["msaview/**", ".github/workflows/msaview.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-apple-silicon, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-intel, os: macos-latest, target: x86_64-apple-darwin }
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo build --release -p msaview --target ${{ matrix.target }}
      - name: Package with a small sample alignment
        shell: bash
        run: |
          d=msaview-${{ matrix.name }}
          mkdir "$d"
          cp target/${{ matrix.target }}/release/msaview target/${{ matrix.target }}/release/msagen "$d/"
          # A 2,000 x 3,000 synthetic alignment to try it on (generated by the build's own msagen).
          if [ "${{ matrix.target }}" != "x86_64-apple-darwin" ]; then "$d/msagen" 2000 3000 "$d/sample_2k.fa"; fi
          cp LICENSE "$d/"
          cat > "$d/README.txt" <<'EOF'
          msaview: a GPU-drawn viewer for large multiple sequence alignments (irit project).
          Docs: https://dzulfikar08.github.io/irit/tools/msaview/

          Run:   ./msaview sample_2k.fa          (or any aligned FASTA / Clustal / Stockholm file)
          Make a bigger test file:   ./msagen 100000 30000 big.fa   (about 3 GB)

          macOS: the binaries are not signed. After unzipping, clear the download flag once:
                 xattr -dr com.apple.quarantine .
          EOF
          sed -i.bak 's/^          //' "$d/README.txt" && rm -f "$d/README.txt.bak"
      - uses: actions/upload-artifact@v4
        with:
          name: msaview-${{ matrix.name }}
          path: msaview-${{ matrix.name }}/
