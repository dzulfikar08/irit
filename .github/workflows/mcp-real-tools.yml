# Opt-in check of irit-mcp's third-party wrappers against the real programs: fastp 1.4.0,
# Shovill 1.4.2, Bakta 1.12.2 (light database), CheckM2 1.1.0, GTDB-Tk 2.8.0 (GTDB's mock database),
# mlst 2.35.0, AMRFinderPlus 4.2.7 (dblock's pinned database), CoverM 0.8.0 (also for isolate depth
# and multi-genome abundance), MEGAHIT 1.2.9, MetaBAT 2.18, SemiBin 2.6.0, galah 0.6.3 and
# Kleborate 3.2.4, on a small genome, on real S. aureus reads and on a K. pneumoniae reference
# genome, then isotable (and its assembly statistics). Downloads about 3 GB of databases and takes about an hour, so it
# only runs by hand:
#   gh workflow run mcp-real-tools.yml --ref <branch>
name: irit-mcp real tools

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  real-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Free disk space (databases need about 10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build irit-mcp, dblock and isotable
        run: cargo build --release -p irit-mcp -p dblock -p isotable

      # One environment per tool, as their pinned dependencies (DIAMOND, Prodigal, Python)
      # differ. Each tool is reached through a wrapper that puts its own environment first on PATH.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fastp
          create-args: -c conda-forge -c bioconda fastp=1.4.0
          init-shell: bash
      - name: Tool environments
        shell: bash -el {0}
        run: |
          # Shovill 1.4.2 asks `spades.py --version` even when SKESA assembles; SPAdes 3.15.5's script
          # fails on the newer Python the solver otherwise picks, so Shovill's environment gets 3.11.
          for spec in "bakta bakta=1.12.2" "checkm2 checkm2=1.1.0" "gtdbtk gtdbtk=2.8.0" "shovill shovill=1.4.2 python=3.11" \
                      "mlst mlst=2.35.0" "amrfinder ncbi-amrfinderplus=4.2.7" "megahit megahit=1.2.9" "coverm coverm=0.8.0" \
                      "metabat2 metabat2=2.18" "semibin semibin=2.6.0"; do
            set -- $spec
            name=$1; shift
            micromamba create -y -n "$name" -c conda-forge -c bioconda "$@"
          done
          # galah 0.6.3 runs skani; Bioconda's package also pulls in CheckM2 with TensorFlow (about 1 GB)
          # for --run-checkm2, which irit-mcp doesn't use, so galah goes in without its dependencies.
          micromamba create -y -n galah -c conda-forge -c bioconda skani=0.4.0
          micromamba install -y -n galah --no-deps -c conda-forge -c bioconda galah=0.6.3
          # Kleborate 3.2.4 from pip: Bioconda's package also installs ECTyper, whose install script downloads
          # about 900 MB. pip's needs pandas, and Kaptive 3.2.x (3.3 dropped kaptive.database, which it imports).
          micromamba create -y -n kleborate -c conda-forge -c bioconda python=3.12 mash minimap2 pip
          "$MAMBA_ROOT_PREFIX/envs/kleborate/bin/pip" install kleborate==3.2.4 kaptive==3.2.2 pandas
          "$MAMBA_ROOT_PREFIX/envs/shovill/bin/spades.py" --version
          mkdir -p "$HOME/tool-bin"
          root=${MAMBA_ROOT_PREFIX:?setup-micromamba sets MAMBA_ROOT_PREFIX}
          # program:environment. amrfinder_index is what dblock runs to index the AMRFinderPlus database.
          for pe in fastp:fastp bakta:bakta checkm2:checkm2 gtdbtk:gtdbtk shovill:shovill mlst:mlst amrfinder:amrfinder amrfinder_index:amrfinder \
                    megahit:megahit coverm:coverm metabat2:metabat2 kleborate:kleborate SemiBin2:semibin galah:galah; do
            t=${pe%%:*}; e=${pe#*:}
            # CheckM2's TensorFlow library asks for an executable stack, which newer glibc refuses
            # ("cannot enable executable stack"); this tunable allows it for that process only.
            extra=""; [ "$t" = checkm2 ] && extra="GLIBC_TUNABLES=glibc.rtld.execstack=2; export GLIBC_TUNABLES"
            printf '#!/bin/sh\nPATH=%s/envs/%s/bin:$PATH\nexport PATH\n%s\nexec %s/envs/%s/bin/%s "$@"\n' "$root" "$e" "$extra" "$root" "$e" "$t" > "$HOME/tool-bin/$t"
            chmod +x "$HOME/tool-bin/$t"
            # MetaBAT2 has no --version; the first line of its --help (on stderr) names it
            if [ "$t" = metabat2 ]; then "$HOME/tool-bin/$t" --help 2>&1 >/dev/null | sed -n '/./{p;q;}'; else "$HOME/tool-bin/$t" --version | head -n 1; fi
          done
          # Bakta 1.12.2 calls its own environment's amrfinder; it must read the 4.2 database format.
          "$root/envs/bakta/bin/amrfinder" --version

      - name: Test data
        run: |
          mkdir -p work/asm work/reads work/gtdb_genomes
          cd work
          # Mycoplasma genitalium G37 (580 kb, translation table 4)
          curl -fsSL https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/027/325/GCF_000027325.1_ASM2732v1/GCF_000027325.1_ASM2732v1_genomic.fna.gz | gunzip > asm/mg.fna
          # 20,000 error-free 2x150 pairs from it, for fastp
          python3 - <<'EOF'
          import gzip, random
          random.seed(1)
          seq = "".join(l.strip() for l in open("asm/mg.fna") if not l.startswith(">"))
          comp = str.maketrans("ACGTN", "TGCAN")
          with gzip.open("reads/mg_R1.fastq.gz", "wt") as r1, gzip.open("reads/mg_R2.fastq.gz", "wt") as r2:
              for i in range(20000):
                  s = random.randrange(0, len(seq) - 400)
                  frag = seq[s:s + 350]
                  r1.write(f"@r{i}/1\n{frag[:150]}\n+\n{'F' * 150}\n")
                  r2.write(f"@r{i}/2\n{frag[-150:].translate(comp)[::-1]}\n+\n{'F' * 150}\n")
          EOF
          # The test genome for GTDB's mock GTDB-Tk database (the database itself comes through
          # dblock_fetch as gtdbtk-r232-mockup, now that GTDB corrected its MD5, GTDBTk#726).
          curl -fsSL -o gtdb_genomes/test_genome_G021783475.fna.gz https://data.gtdb.ecogenomic.org/releases/release232/232.0/auxillary_files/gtdbtk_package/mockup_db/test_genome_G021783475.fna.gz
          # Klebsiella pneumoniae HS11286 (ST11, KPC-2), the complete RefSeq genome, for Kleborate
          mkdir -p kp
          curl -fsSL https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/240/185/GCF_000240185.1_ASM24018v2/GCF_000240185.1_ASM24018v2_genomic.fna.gz | gunzip > kp/HS11286.fna
          # Real Illumina reads of an EMRSA-15 Staphylococcus aureus (ENA ERR044595, HiSeq 2000 2x75),
          # 1M pairs, as nf-core/bacass tests with: for Shovill, mlst (ST22) and AMRFinderPlus (mecA).
          for m in 1 2; do
            curl -fsSL -o reads/ERR044595_1M_$m.fastq.gz https://raw.githubusercontent.com/nf-core/test-datasets/bacass/ERR044595_1M_$m.fastq.gz
          done
          ls -la asm reads gtdb_genomes

      - name: Run the tools through irit-mcp, twice, then replay
        run: |
          python3 .github/scripts/mcp_real_tools.py \
            --mcp "$PWD/target/release/irit-mcp" --work work \
            --path "$HOME/tool-bin:$PWD/target/release:$PATH"

      - name: Keep the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irit-mcp-real-tools-run
          path: |
            work/irit-runs
            work/*_first/*.json
            work/*_first/*.txt
            work/*_first/*.log
            work/checkm2_first/quality_report.tsv
            work/gtdbtk_first/classify/*.summary.tsv
            work/typing_first/*
            work/kleb_first/*
            work/shovill_first/sa/shovill.log
            work/mag_first/depth.tsv
            work/mag_first/derep/clusters.tsv
            work/mag_first/abundance.tsv
            work/mag_first/asm/log
            work/dblock.lock
          if-no-files-found: warn
