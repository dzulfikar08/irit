name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CLIS: -p sheetgen -p leanqc -p isotable -p dblock

jobs:
  # Linux: every crate, including msascope's GPUI viewer.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for msascope (GPUI)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # irit-mcp's integration test runs the real leanqc binary.
      - run: cargo build --release $CLIS
      - run: cargo test --workspace

  # macOS: everything except the GUI build (msascope's core is tested without it).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude msascope --all-targets -- -D warnings
      - run: cargo clippy -p msascope --no-default-features --all-targets -- -D warnings
      - run: cargo build --release $CLIS
      - run: cargo test --workspace --exclude msascope
      - run: cargo test -p msascope --no-default-features

  # Windows: the four command-line tools (irit-mcp and gtdbprep use Unix-only APIs for now) and
  # msascope's core; msascope.yml builds the viewer itself.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p sheetgen -p leanqc -p isotable -p dblock --all-targets -- -D warnings
      - run: cargo test -p sheetgen -p leanqc -p isotable -p dblock
      - run: cargo clippy -p msascope --no-default-features --all-targets -- -D warnings
      - run: cargo test -p msascope --no-default-features
