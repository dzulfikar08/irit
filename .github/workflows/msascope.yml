name: msascope builds

# Builds the desktop viewer (and the msagen test-data generator) on GitHub's runners and uploads
# them as downloadable artifacts, so nobody has to compile GPUI locally. Not signed or notarised:
# these are ad-hoc test builds. Signed, notarised msascope builds come from release.yml (v* tags).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["msascope/**", "scripts/macos-app.sh", "scripts/build-dmg.sh", "scripts/acknowledgements.sh", "scripts/assets/**", ".github/workflows/msascope.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # msascope's dependencies must stay permissively licensed: its App Store edition depends on it
  # (msascope/deny.toml explains).
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: msascope/Cargo.toml
          command: check licenses

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-apple-silicon, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-intel, os: macos-latest, target: x86_64-apple-darwin }
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo build --release -p msascope --target ${{ matrix.target }}
      - name: Package with a small sample alignment
        shell: bash
        run: |
          d=msascope-${{ matrix.name }}
          exe=""; if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          mkdir "$d"
          cp target/${{ matrix.target }}/release/msascope$exe target/${{ matrix.target }}/release/msagen$exe "$d/"
          # Smoke test, and a 2,000 x 3,000 synthetic alignment to try it on (generated by the build's
          # own msagen). The Intel macOS build can't run on the Apple Silicon runner.
          if [ "${{ matrix.target }}" != "x86_64-apple-darwin" ]; then
            "$d/msascope$exe" --help
            "$d/msagen$exe" 2000 3000 "$d/sample_2k.fa"
          fi
          cp LICENSE "$d/"
          cat > "$d/README.txt" <<'EOF'
          msascope: a GPU-drawn viewer for large multiple sequence alignments (irit project).
          Docs: https://dzulfikar08.github.io/irit/tools/msascope/

          Run:   ./msascope sample_2k.fa          (or any aligned FASTA / Clustal / Stockholm file)
          Make a bigger test file:   ./msagen 100000 30000 big.fa   (about 3 GB)

          macOS: the binaries are not signed. After unzipping, clear the download flag once:
                 xattr -dr com.apple.quarantine .
          EOF
          sed -i.bak 's/^          //' "$d/README.txt" && rm -f "$d/README.txt.bak"
      # The app bundle and DMG scripts release.yml uses, ad-hoc signed (no Developer ID here).
      - name: msascope.app and DMG (ad-hoc signed, Apple Silicon only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          brew install librsvg
          cargo install cargo-about --locked --features cli
          ./scripts/acknowledgements.sh dist/Acknowledgements.html
          MSASCOPE_ACKNOWLEDGEMENTS=dist/Acknowledgements.html \
            ./scripts/build-dmg.sh --name msascope-test target/${{ matrix.target }}/release/msascope dist
          test -f dist/msascope.app/Contents/Resources/Acknowledgements.html
          plutil -p dist/msascope.app/Contents/Info.plist | grep -q CFBundleDocumentTypes
          plutil -p dist/msascope.app/Contents/Info.plist | grep -E 'CFBundle(Identifier|Executable|Name)'
          grep -q '<string>com.dzulfikar.irit.msascope</string>' dist/msascope.app/Contents/Info.plist
          dist/msascope.app/Contents/MacOS/msascope --help > /dev/null
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/msascope-test.dmg
          test -d "$mnt/msascope.app" && test -L "$mnt/Applications"
          hdiutil detach "$mnt"
      # The App Store edition runs sandboxed: an ad-hoc signed copy with its sandbox entitlements
      # must still start, and must not be able to read a file the user didn't choose.
      - name: Sandboxed copy (App Store entitlements, ad-hoc)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          rm -rf sbx && mkdir sbx && ditto dist/msascope.app sbx/msascope.app
          codesign --force --sign - --entitlements scripts/assets/msascope-sandbox-test.entitlements sbx/msascope.app
          codesign -d --entitlements - --xml sbx/msascope.app | plutil -p - | grep -q app-sandbox
          sbx/msascope.app/Contents/MacOS/msascope --help > /dev/null
          f="$PWD/msascope/tests/data/pf00042_seed_40x20.sto"
          if sbx/msascope.app/Contents/MacOS/msascope --stats "$f" > sbx/out.txt 2>&1; then
            echo "::error::the sandboxed msascope read a file nobody chose"; cat sbx/out.txt; exit 1
          fi
          cat sbx/out.txt
          grep -qi "not permitted" sbx/out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msascope-${{ matrix.name }}
          path: msascope-${{ matrix.name }}/
