name: Validate against real tools

# Checks each tool against the established tool it replaces or feeds, on real data,
# using GitHub-hosted runners. Results appear in each run's summary.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC: also catches upstream changes (databases, pipelines)
  push:
    branches: [main]
    paths: ["leanqc/**", "sheetgen/**", "dblock/**", "scripts/**", ".github/workflows/validate.yml"]

env:
  CARGO_TERM_COLOR: always
  TESTDATA: https://github.com/nf-core/test-datasets/raw/bacass

jobs:
  leanqc-vs-fastqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p leanqc
      - name: Download nf-core/bacass test reads
        run: |
          mkdir reads
          for f in ERR064912_1M_1 ERR064912_1M_2 ERR044595_1M_1 ERR044595_1M_2; do
            curl -sfL "$TESTDATA/$f.fastq.gz" -o "reads/$f.fastq.gz"
          done
          ls -la reads
      - name: leanqc
        run: /usr/bin/time -v target/release/leanqc -t 4 -o leanqc-out reads/*.fastq.gz 2> leanqc-time.txt; cat leanqc-time.txt | grep -E 'Elapsed|Maximum resident'
      - name: FastQC 0.12.1 (the container nf-core uses)
        run: |
          mkdir fastqc
          docker pull -q quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0
          docker run --rm -v "$PWD:/d" -w /d quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0 \
            sh -c 'fastqc -q -t 4 -o fastqc reads/*.fastq.gz && echo "peak MB $(( $(cat /sys/fs/cgroup/memory.peak) / 1048576 ))"' | tee fastqc-mem.txt
          cd fastqc && for z in *.zip; do unzip -q "$z"; done
      - name: Compare verdicts
        run: |
          {
            echo "## leanqc vs FastQC"
            echo
            python3 scripts/compare_fastqc.py fastqc leanqc-out
            echo
            echo "leanqc: $(grep -E 'Elapsed' leanqc-time.txt | sed 's/.*: //') wall, $(grep -E 'Maximum resident' leanqc-time.txt | awk '{printf "%.0f MB", $NF/1024}') peak RSS"
            echo "FastQC: $(grep 'peak MB' fastqc-mem.txt | awk '{print $3}') MB peak (container cgroup)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/compare_fastqc.py fastqc leanqc-out > /dev/null
      - name: Synthetic corpus (re-record FastQC's verdicts for every file, then compare)
        run: |
          # Records FastQC's verdicts for all corpus files, including those in pending_verdicts.tsv.
          ./scripts/fastqc_corpus.sh
          # Drift: any committed verdict that changed, or a new file not listed as pending, fails.
          # Verdicts for pending files are new rows: shown in the summary, uploaded, and compared
          # with leanqc by the corpus test below.
          git show HEAD:leanqc/tests/corpus/fastqc_verdicts.tsv > committed_verdicts.tsv
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys
          def rows(path):
              lines = [l.rstrip("\n") for l in open(path) if l.strip() and not l.startswith("#")]
              return {tuple(l.split("\t")[:2]): l.split("\t")[2] for l in lines[1:]}
          old = rows("committed_verdicts.tsv")
          new = rows("leanqc/tests/corpus/fastqc_verdicts.tsv")
          pending = {k[0] for k in rows("leanqc/tests/corpus/pending_verdicts.tsv")}
          old_files = {f for f, _ in old}
          bad = [f"{f} / {m}: committed {v}, FastQC now {new.get((f, m))}" for (f, m), v in old.items() if new.get((f, m)) != v]
          bad += [f"{f} / {m}: {v} (new row for a file that was already recorded)" for (f, m), v in new.items() if (f, m) not in old and f in old_files]
          bad += [f"{f}: new corpus file, not in pending_verdicts.tsv" for f in {f for f, _ in new} - old_files - pending]
          print("## FastQC verdicts on the synthetic corpus\n")
          for f in sorted(pending):
              got = sorted((m, v) for (g, m), v in new.items() if g == f)
              print(f"- pending `{f}`: " + (", ".join(f"{m} {v}" for m, v in got) or "no verdicts"))
          if bad:
              print("\nDrift from the committed fastqc_verdicts.tsv:\n")
              print("\n".join(f"- {b}" for b in bad))
              sys.exit(1)
          print("\nNo drift in committed verdicts. To record pending files, take fastqc_verdicts.tsv from the qc-reports artifact and empty pending_verdicts.tsv.")
          PY
          cargo test --release -p leanqc --test corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qc-reports
          path: |
            leanqc-out/
            fastqc/*.html
            leanqc/tests/corpus/fastqc_verdicts.tsv

  sheetgen-bacass:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (bacass pulls ~16 GB of containers)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sheetgen
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Nextflow and pull nf-core/bacass 2.7.0
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow pull nf-core/bacass -r 2.7.0
      - name: Build a messy reads folder
        run: |
          mkdir -p dl messy/run1 "messy/run2/batch b"
          for f in ERR064912_1M_1 ERR064912_1M_2 ERR044595_1M_1 ERR044595_1M_2; do
            curl -sfL "$TESTDATA/$f.fastq.gz" -o "dl/$f.fastq.gz"
          done
          A=$PWD/dl/ERR064912_1M_1.fastq.gz; B=$PWD/dl/ERR064912_1M_2.fastq.gz
          C=$PWD/dl/ERR044595_1M_1.fastq.gz; D=$PWD/dl/ERR044595_1M_2.fastq.gz
          ln -s "$A" messy/run1/Ecoli-A_S1_L001_R1_001.fastq.gz; ln -s "$B" messy/run1/Ecoli-A_S1_L001_R2_001.fastq.gz
          ln -s "$A" messy/run1/Ecoli-A_S1_L002_R1_001.fastq.gz; ln -s "$B" messy/run1/Ecoli-A_S1_L002_R2_001.fastq.gz
          ln -s "$A" messy/run1/Ecoli-A_S1_L001_I1_001.fastq.gz
          ln -s "$C" messy/run2/ERR044595_1.fastq.gz; ln -s "$D" messy/run2/ERR044595_2.fastq.gz
          ln -s "$C" "messy/run2/batch b/iso 7_R1.fq.gz"; ln -s "$D" "messy/run2/batch b/iso 7_R2.fq.gz"
          ln -s "$C" messy/run2/orphan_R1.fastq.gz
      - name: sheetgen must reject paths with spaces (bacass forbids them)
        run: |
          if target/release/sheetgen messy --pipeline nf-core/bacass -o /dev/null; then
            echo "expected a schema error"; exit 1
          fi
      - name: sheetgen with clean links
        run: |
          target/release/sheetgen messy --pipeline nf-core/bacass --link-into links -o sheet.tsv
          cat sheet.tsv
      - name: nf-core/bacass accepts the sheet (stub run)
        run: |
          nextflow run nf-core/bacass -r 2.7.0 -profile test,docker -stub-run \
            --input sheet.tsv --outdir out -ansi-log false 2>&1 | tee bacass.log
          grep -E "Pipeline completed successfully" bacass.log
          {
            echo "## sheetgen → nf-core/bacass 2.7.0 (stub run)"
            echo
            echo '```'
            cat sheet.tsv
            echo '```'
            echo
            echo "Steps submitted: $(grep -c 'Submitted process' bacass.log || true)"
            echo "Lane-merge steps run: $(grep -c 'CAT_FASTQ_SHORT' bacass.log || true)"
          } >> "$GITHUB_STEP_SUMMARY"

  dblock-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p dblock
      - name: Fetch, verify, env
        env:
          DBLOCK_STORE: ${{ runner.temp }}/store
        run: |
          B=$PWD/target/release/dblock; mkdir proj && cd proj
          $B add kraken2-viral-20261022 card-4.0.2 silva-144-qiime2-v4
          $B plan
          $B fetch
          $B verify
          $B env
          cat dblock.lock
      - name: Streaming, resume, and a wrong checksum
        env:
          DBLOCK_STORE: ${{ runner.temp }}/store2
        run: |
          B=$PWD/target/release/dblock; mkdir proj2 && cd proj2
          cat > test-catalog.json <<'EOF'
          [{"id": "test-card-wrong-md5", "name": "CARD with a deliberately wrong checksum", "version": "4.0.2", "tool": "RGI",
            "urls": ["https://card.mcmaster.ca/download/0/broadstreet-v4.0.2.tar.bz2"], "format": "tar.bz2",
            "size": 4366637, "extracted": 50292963, "md5": "00000000000000000000000000000000",
            "md5_source": "deliberately wrong", "env": null, "compat": null, "licence": "test"}]
          EOF
          $B --catalog test-catalog.json add card-4.0.2 kraken2-viral-20261022 test-card-wrong-md5
          $B --catalog test-catalog.json fetch --stream card-4.0.2
          timeout 5 $B --catalog test-catalog.json fetch kraken2-viral-20261022 || true
          $B --catalog test-catalog.json fetch kraken2-viral-20261022 2>&1 | tee resume.log
          grep -q "resuming: " resume.log
          if $B --catalog test-catalog.json fetch test-card-wrong-md5; then echo "wrong checksum was accepted"; exit 1; fi
          test ! -e "$DBLOCK_STORE/test-card-wrong-md5"
      - name: GTDB R232 mock database (GTDBTk#726)
        env:
          DBLOCK_STORE: ${{ runner.temp }}/store3
        run: |
          B=$PWD/target/release/dblock; mkdir proj3 && cd proj3
          $B add gtdbtk-r232-mockup
          if $B fetch; then
            echo "::notice::GTDB's mock database now matches its published checksum: GTDBTk#726 looks fixed; update the catalog note."
          else
            echo "::notice::Still mismatched (GTDBTk#726); dblock correctly refuses it."
          fi

  qc-speed:
    # Time and memory of FastQC 0.12.1, FastQC-Rust and leanqc on the same files, same runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p leanqc
      - name: Download test reads and FastQC-Rust
        run: |
          mkdir reads
          for f in ERR064912_1M_1 ERR064912_1M_2 ERR044595_1M_1 ERR044595_1M_2; do
            curl -sfL "$TESTDATA/$f.fastq.gz" -o "reads/$f.fastq.gz"
          done
          mkdir fqrs && curl -fsSL https://github.com/ewels/FastQC-Rust/releases/latest/download/fastqc-linux-x86_64.tar.gz | tar xz -C fqrs --strip-components=1
          fqrs/fastqc --version
          docker pull -q quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0
      - name: Time three runs of each
        run: |
          one=reads/ERR064912_1M_1.fastq.gz
          measure() { # name, then command; prints "name<TAB>seconds<TAB>MB"
            local name=$1; shift
            /usr/bin/time -f '%e %M' -o t.txt "$@" > /dev/null 2>&1
            read -r s kb < t.txt; printf '%s\t%s\t%s\n' "$name" "$s" "$((kb / 1024))"
          }
          java_peak() { # FastQC runs in Docker, so take the container's own peak memory
            local t0 t1; t0=$(date +%s.%N)
            mb=$(docker run --rm -v "$PWD:/d" -w /d quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0 \
              sh -c "mkdir -p o && fastqc -q $1 -o o $2 >/dev/null 2>&1; echo \$((\$(cat /sys/fs/cgroup/memory.peak) / 1048576))")
            t1=$(date +%s.%N); printf '%s\t%s\t%s\n' "$3" "$(echo "$t1 - $t0" | bc)" "$mb"
          }
          sudo apt-get install -y -qq bc > /dev/null
          for i in 1 2 3; do
            rm -rf o1 o2 o3 o4 && mkdir o1 o2 o3 o4
            measure "leanqc, 1 file, 1 thread" target/release/leanqc -t 1 -o o1 "$one"
            measure "FastQC-Rust, 1 file, 1 thread" fqrs/fastqc -q -t 1 -o o2 "$one"
            java_peak "-t 1" "$one" "FastQC 0.12.1 (Docker), 1 file, 1 thread"
            measure "leanqc, 4 files, 4 threads" target/release/leanqc -t 4 -o o3 reads/*.fastq.gz
            measure "FastQC-Rust, 4 files, 4 threads" fqrs/fastqc -q -t 4 -o o4 reads/*.fastq.gz
            java_peak "-t 4" "reads/*.fastq.gz" "FastQC 0.12.1 (Docker), 4 files, 4 threads"
          done | tee runs.tsv
          {
            echo "## QC speed: FastQC 0.12.1, FastQC-Rust, leanqc (median of 3; ubuntu-latest)"
            echo
            echo "| Tool and input | Wall time (s) | Peak memory (MB) |"
            echo "|---|---|---|"
            sort -t$'\t' -k1,1 -s runs.tsv | awk -F'\t' '{n[$1]++; t[$1,n[$1]]=$2; m[$1,n[$1]]=$3}
              END {for (k in n) {split("",a); for(i=1;i<=n[k];i++) a[i]=t[k,i]; asort(a); split("",b); for(i=1;i<=n[k];i++) b[i]=m[k,i]; asort(b);
                   printf "| %s | %.2f | %d |\n", k, a[int((n[k]+1)/2)], b[int((n[k]+1)/2)]}}' | sort
            echo
            echo "FastQC's time includes starting its container (about 0.5 s); its memory is the container's cgroup peak."
          } | tee -a "$GITHUB_STEP_SUMMARY"
