[package]
name = "gtdbprep"
description = "Laptop half of a split GTDB-Tk: run identify + align locally and write a small, renamed bundle for placement"
edition.workspace = true
license.workspace = true
version.workspace = true
repository = "https://github.com/dzulfikar08/irit"

[[bin]]
name = "gtdbprep"
path = "src/main.rs"

[[bin]]
name = "irit-gtdb-prep"
path = "src/bin/irit-gtdb-prep.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.11"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4.46"

[dev-dependencies]
tempfile = "3.27"

